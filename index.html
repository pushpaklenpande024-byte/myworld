<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pushpak Commerce Classes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#155129;
    color:yellow;
    text-align:center;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.hero h1{
    font-size:70px;
}

.hero h2{
    margin:10px 0;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:8px;
    background:yellow;
    color:#155129;
    font-size:18px;
    cursor:pointer;
}

#about{
    display:none;
    padding:40px 20px;
}

img{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
}
</style>

</head>
<body>

<section class="hero" id="home">
<h1>PCC</h1>
<h2>Pushpak Commerce Classes</h2>

<button onclick="showAbout()">Explore</button>
</section>

<section id="about">

<img src="WhatsApp Image 2026-07-29 at 9.16.11 AM.jpeg" alt="My Photo" width="200">

<h2>Pushpak Lenpande</h2>

<h3>Commerce Teacher</h3>

<h2>Education</h2>

<p>M.Com (Final Year)</p>

<p>B.Com</p>

</section>

<script>
function showAbout(){
document.getElementById("home").style.display="none";
document.getElementById("about").style.display="block";
}
</script>

</body>
</html>
