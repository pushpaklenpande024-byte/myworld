<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pushpak Commerce Classes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#155129;
    color:yellow;
    text-align:center;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
<section class="section">
    <h2>📚 Courses</h2>

    <div class="card">Class 11 Commerce</div>
    <div class="card">Class 12 Commerce</div>
    <div class="card"> B.com M.com Commerce</div>
    <div class="card">Accountancy</div>
    <div class="card">Business Studies</div>
    <div class="card">Economics</div>
</section>

<section class="section">
    <h2>⭐ Why Choose PCC?</h2>

    <ul class="list">
        <li>✔️ Experienced Commerce Teacher</li>
        <li>✔️ Easy Concept Explanation</li>
        <li>✔️ Weekly Tests</li>
        <li>✔️ Exam Oriented Notes</li>
        <li>✔️ Doubt Solving Classes</li>
        <li>✔️ Affordable Fees</li>
    </ul>
</section>

<section class="section">
    <h2>📝 Student Registration</h2>

    <form>

        <input type="text" placeholder="Student Name" required>

        <input type="number" placeholder="Mobile Number" required>

        <input type="email" placeholder="Email">

        <select required>
            <option>Select Class</option>
            <option>Class 11</option>
            <option>Class 12</option>
        </select>

        <textarea placeholder="Message"></textarea>

        <button type="submit">Register Now</button>

    </form>
</section>

    
.hero h1{
    font-size:70px;
}

.hero h2{
    margin:10px 0;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:8px;
    background:yellow;
    color:#155129;
    font-size:18px;
    cursor:pointer;
}

#about{
    display:none;
    padding:40px 20px;
}

img{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
}
</style>

</head>
<body>

<section class="hero" id="home">
<h1>PCC</h1>
<h2>Pushpak Commerce Classes</h2>

<button onclick="showAbout()">Explore</button>
</section>

<section id="about">

<img src="WhatsApp Image 2026-07-29 at 9.16.11 AM.jpeg" alt="My Photo" width="200">">

<h2>Pushpak Lenpande</h2>

<h3>Commerce Educator</h3>

<h2>Education</h2>

<p>M.Com (Final Year)</p>

<p>B.Com</p>

</section>

<script>
function showAbout(){
document.getElementById("home").style.display="none";
document.getElementById("about").style.display="block";
}
</script>

</body>
</html>
